<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>ぽっカフェ ご利用案内</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-gray-100">

    <header class="bg-white/80 sticky top-0 z-40 border-b p-4 flex items-center justify-between gap-2 backdrop-blur-md">
        <a href="/" class="inline-flex items-center justify-center min-h-[44px] px-4 text-[13px] font-bold text-white bg-orange-500 rounded-full active:scale-95 transition-transform">
            ← 予約アプリに戻る
        </a>
        <a href="/manual.pdf" download="ぽっカフェ_ご利用案内.pdf" class="text-[12px] font-bold text-orange-500 underline">PDFを保存</a>
    </header>

    <main id="pages" class="max-w-3xl mx-auto p-2 space-y-3">
        <p id="loading" class="text-center text-gray-400 py-10">読み込み中…</p>
    </main>

    <div class="max-w-3xl mx-auto p-4 pb-10 text-center">
        <a href="/" class="inline-flex items-center justify-center min-h-[44px] px-6 text-[13px] font-bold text-white bg-orange-500 rounded-full active:scale-95 transition-transform">
            ← 予約アプリに戻る
        </a>
    </div>

    <script>
        // アプリから来た場合は履歴を戻る（カートなど画面の状態を残すため）。直接開いた場合はトップへ
        document.querySelectorAll('a[href="/"]').forEach(a => a.addEventListener('click', e => {
            if (document.referrer.startsWith(location.origin) && history.length > 1) {
                e.preventDefault();
                history.back();
            }
        }));

        // iOS Safari では <iframe>/<embed> のPDFが1ページ目しか表示されないため、PDF.js で全ページを描画する
        (async () => {
            const container = document.getElementById('pages');
            const loading = document.getElementById('loading');
            try {
                pdfjsLib.GlobalWorkerOptions.workerSrc =
                    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                const pdf = await pdfjsLib.getDocument('/manual.pdf').promise;
                const dpr = window.devicePixelRatio || 1;
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const width = container.clientWidth - 16;
                    const base = page.getViewport({ scale: 1 });
                    const viewport = page.getViewport({ scale: (width / base.width) * dpr });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    canvas.className = 'w-full bg-white shadow-sm rounded';
                    container.appendChild(canvas);
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                }
                loading.remove();
            } catch (err) {
                console.error('ご利用案内の表示に失敗:', err);
                loading.innerHTML = '表示できませんでした。<a href="/manual.pdf" class="text-orange-500 underline">こちらからPDFを開いてください</a>';
            }
        })();
    </script>
</body>
</html>
